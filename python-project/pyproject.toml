[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-autonomous-navigation"
version = "1.0.0"
description = "A laptop-friendly 2D robot navigation simulator using A* path planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame==2.6.1"]

[project.scripts]
autonav = "autonav.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
